pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
    }
}

// Permite ao Gradle BAIXAR automaticamente os JDKs exigidos por toolchains.
// O submodulo MioLibPatcher declara toolchain Java 8; sem isto o build falha com
// "Cannot find a Java installation ... matching: {languageVersion=8}" em qualquer
// maquina que nao tenha um JDK 8 instalado (Foojay e o provedor oficial usado
// pela documentacao do Gradle).
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

rootProject.name='MineDrakk'
include ':jre_lwjgl3glfw'
include ":jre_lwjgl3glfw:lwjgl-3.3.3"
include ":jre_lwjgl3glfw:lwjgl-3.4.1"
include ':app_pojavlauncher'

include ':arc_dns_injector'
include ':MioLibPatcher'
include ':forge_installer'
